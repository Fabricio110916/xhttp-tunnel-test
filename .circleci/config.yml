version: 2.1

jobs:
  build:
    docker:
      - image: cimg/android:2024.01
    resource_class: medium
    environment:
      GRADLE_OPTS: -Xmx512m -XX:MaxMetaspaceSize=128m
    steps:
      - checkout
      - run:
          name: Build APK
          command: |
            echo "android.useAndroidX=true" >> gradle.properties
            echo "android.enableJetifier=true" >> gradle.properties
            echo "org.gradle.jvmargs=-Xmx512m" >> gradle.properties
            chmod +x gradlew
            ./gradlew assembleDebug --no-daemon --no-parallel
      - store_artifacts:
          path: app/build/outputs/apk/debug/
          destination: apk

workflows:
  build:
    jobs:
      - build
