version: 2.1

jobs:
  build-tun2socks-so:
    docker:
      - image: cimg/go:1.23
    resource_class: medium
    steps:
      - run:
          name: Install NDK
          command: |
            sudo apt-get update -qq
            sudo apt-get install -y unzip wget
            mkdir -p /tmp/ndk
            cd /tmp/ndk
            wget -q https://dl.google.com/android/repository/android-ndk-r26d-linux.zip
            unzip -q android-ndk-r26d-linux.zip
            echo "NDK installed"
      - run:
          name: Download tun2socks source
          command: |
            cd /tmp
            wget -q https://github.com/xjasonlyu/tun2socks/archive/refs/tags/v2.6.0.tar.gz
            tar -xzf v2.6.0.tar.gz
      - run:
          name: Fix go.mod and Tidy
          command: |
            cd /tmp/tun2socks-2.6.0
            sed -i 's/^go 1.23.1/go 1.23/' go.mod
            sed -i 's/^go 1.23.0/go 1.23/' go.mod
            go mod tidy
      - run:
          name: Prepare main.go for shared library (Rename main to Run)
          command: |
            cd /tmp/tun2socks-2.6.0
            # Renomeia a função main() para Run()
            sed -i 's/func main()/func Run()/' main.go
      - run:
          name: Create bridge.go with JNI exports and new main()
          command: |
            cd /tmp/tun2socks-2.6.0
            echo 'package main' > bridge.go
            echo '' >> bridge.go
            echo 'import "C"' >> bridge.go
            echo 'import (' >> bridge.go
            echo '    "fmt"' >> bridge.go
            echo '    "os"' >> bridge.go
            echo ')' >> bridge.go
            echo '' >> bridge.go
            echo '//export StartTun2socks' >> bridge.go
            echo 'func StartTun2socks(cProxy *C.char, cDevice *C.char, cMtu C.int) C.int {' >> bridge.go
            echo '    proxy := C.GoString(cProxy)' >> bridge.go
            echo '    device := C.GoString(cDevice)' >> bridge.go
            echo '    mtu := int(cMtu)' >> bridge.go
            echo '    os.Args = []string{"tun2socks", "-proxy", proxy, "-device", device, "-mtu", fmt.Sprintf("%d", mtu), "-loglevel", "info"}' >> bridge.go
            echo '    go Run()' >> bridge.go
            echo '    return 0' >> bridge.go
            echo '}' >> bridge.go
            echo '' >> bridge.go
            echo '//export StopTun2socks' >> bridge.go
            echo 'func StopTun2socks() {}' >> bridge.go
            echo '' >> bridge.go
            # Para o buildmode c-shared, precisa de um main vazio
            echo 'func main() {}' >> bridge.go
      - run:
          name: Build .so for Android ARM64
          command: |
            export ANDROID_NDK_HOME=/tmp/ndk/android-ndk-r26d
            export TOOLCHAIN=$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64
            export CC=$TOOLCHAIN/bin/aarch64-linux-android21-clang
            export CXX=$TOOLCHAIN/bin/aarch64-linux-android21-clang++
            export CGO_ENABLED=1
            export GOOS=android
            export GOARCH=arm64
            cd /tmp/tun2socks-2.6.0
            go build -o libtun2socks.so -buildmode=c-shared .
            ls -la libtun2socks.so
      - store_artifacts:
          path: /tmp/tun2socks-2.6.0/libtun2socks.so
          destination: libtun2socks.so

workflows:
  version: 2
  build:
    jobs:
      - build-tun2socks-so
