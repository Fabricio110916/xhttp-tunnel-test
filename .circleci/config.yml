version: 2.1

jobs:
  build-apk:
    docker:
      - image: cimg/android:2024.01
    resource_class: large
    steps:
      - checkout
      - run:
          name: Build APK
          command: |
            chmod +x gradlew
            ./gradlew assembleDebug --no-daemon
      - store_artifacts:
          path: app/build/outputs/apk/debug/
          destination: apk

workflows:
  version: 2
  build:
    jobs:
      - build-apk
