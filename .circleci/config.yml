version: 2.1

jobs:
  build-tun2socks-so:
    docker:
      - image: cimg/go:1.23
    resource_class: medium
    steps:
      - run:
          name: Install NDK
          command: |
            sudo apt-get update -qq
            sudo apt-get install -y unzip wget
            mkdir -p /tmp/ndk
            cd /tmp/ndk
            wget -q https://dl.google.com/android/repository/android-ndk-r26d-linux.zip
            unzip -q android-ndk-r26d-linux.zip
            export ANDROID_NDK_HOME=/tmp/ndk/android-ndk-r26d
            echo "NDK installed at $ANDROID_NDK_HOME"
      - run:
          name: Download tun2socks source
          command: |
            cd /tmp
            wget -q https://github.com/xjasonlyu/tun2socks/archive/refs/tags/v2.6.0.tar.gz
            tar -xzf v2.6.0.tar.gz
      - run:
          name: Fix go.mod version
          command: |
            cd /tmp/tun2socks-2.6.0
            sed -i 's/^go 1.23.1/go 1.23/' go.mod
            sed -i 's/^go 1.23.0/go 1.23/' go.mod
            cat go.mod | head -5
      - run:
          name: Create export.go with JNI functions
          command: |
            cd /tmp/tun2socks-2.6.0
            echo 'package main' > export.go
            echo '' >> export.go
            echo 'import "C"' >> export.go
            echo 'import (' >> export.go
            echo '    "fmt"' >> export.go
            echo '    "os"' >> export.go
            echo ')' >> export.go
            echo '' >> export.go
            echo '//export StartTun2socks' >> export.go
            echo 'func StartTun2socks(cProxy *C.char, cDevice *C.char, cMtu C.int) C.int {' >> export.go
            echo '    proxy := C.GoString(cProxy)' >> export.go
            echo '    device := C.GoString(cDevice)' >> export.go
            echo '    mtu := int(cMtu)' >> export.go
            echo '    os.Args = []string{"tun2socks", "-proxy", proxy, "-device", device, "-mtu", fmt.Sprintf("%d", mtu), "-loglevel", "info"}' >> export.go
            echo '    go main()' >> export.go
            echo '    return 0' >> export.go
            echo '}' >> export.go
            echo '' >> export.go
            echo '//export StopTun2socks' >> export.go
            echo 'func StopTun2socks() {}' >> export.go
            echo '' >> export.go
            echo 'func main() {}' >> export.go
      - run:
          name: Build .so for Android ARM64
          command: |
            export ANDROID_NDK_HOME=/tmp/ndk/android-ndk-r26d
            export TOOLCHAIN=$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64
            export CC=$TOOLCHAIN/bin/aarch64-linux-android21-clang
            export CXX=$TOOLCHAIN/bin/aarch64-linux-android21-clang++
            export CGO_ENABLED=1
            export GOOS=android
            export GOARCH=arm64
            cd /tmp/tun2socks-2.6.0
            go build -o libtun2socks.so -buildmode=c-shared .
            ls -la libtun2socks.so
      - store_artifacts:
          path: /tmp/tun2socks-2.6.0/libtun2socks.so
          destination: libtun2socks.so

workflows:
  version: 2
  build:
    jobs:
      - build-tun2socks-so
